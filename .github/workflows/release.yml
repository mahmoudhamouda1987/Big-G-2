name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux Tauri system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Tauri application and bundles
        run: npx @tauri-apps/cli@2 build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Create GitHub release and upload assets
        run: |
          files=""
          while IFS= read -r line; do
            if [ -n "$line" ]; then files="$files $line"; fi
          done < <(find bundles -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' \))
          gh release create "${{ github.ref_name }}" $files \
            --title "Big G ${{ github.ref_name }}" \
            --notes "Big G ${{ github.ref_name }} — cross-platform desktop AI assistant. See the repository README for features, tools, security model, and the self-hosted OpenRouter pipeline."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}