[package]
name = "big-g"
version = "0.2.1"
description = "Big G - ultra-secure local Rust bridge for the multi-modal AI desktop overlay"
authors = ["Big G"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "big_g_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "macros"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
